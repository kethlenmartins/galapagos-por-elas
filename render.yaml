databases:
  - name: galapagos-piloto-db
    plan: free
    databaseName: galapagos
    user: galapagos
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

services:
  - type: web
    name: galapagos-piloto-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm db:migrate && pnpm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: APP_ORIGIN
        fromService:
          name: galapagos-piloto-front
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: TERMS_VERSION
        value: "1"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: galapagos-piloto-db
          property: connectionString

  - type: web
    name: galapagos-piloto-front
    runtime: static
    rootDir: front
    buildCommand: pnpm install --frozen-lockfile && VITE_API_URL="${VITE_API_ORIGIN}/api" pnpm build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_ORIGIN
        fromService:
          name: galapagos-piloto-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
